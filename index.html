<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini 3.6 Flash - Interactions API</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --accent: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 1.5rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .badge {
      background: #1e1b4b;
      color: #818cf8;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      border: 1px solid #3730a3;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
    }

    input[type="password"], input[type="text"] {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
    }

    .api-key-input { flex: 1; }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
    }

    .model {
      align-self: flex-start;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
    }

    .prompt-input {
      flex: 1;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    button:hover { background: #2563eb; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-text {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h2>Gemini Interactive Client</h2>
        <span class="badge">Model: gemini-3.6-flash</span>
      </div>
      <input type="password" id="api-key" class="api-key-input" placeholder="Enter GEMINI_API_KEY" />
    </header>

    <div id="chat-box">
      <div class="message model">Hello! Send a prompt to test the Gemini Interactions API.</div>
    </div>

    <div class="input-group">
      <input type="text" id="prompt-input" class="prompt-input" placeholder="Type your prompt..." onkeydown="if(event.key==='Enter') sendInteraction()" />
      <button id="send-btn" onclick="sendInteraction()">Send</button>
    </div>
    <div id="status" class="status-text">API: Interactions API (v1beta)</div>
  </div>

  <script type="module">
    import { GoogleGenAI } from "https://esm.sh/@google/genai@latest";

    let previousInteractionId = null;

    async function sendInteraction() {
      const apiKey = document.getElementById("api-key").value.trim();
      const promptInput = document.getElementById("prompt-input");
      const chatBox = document.getElementById("chat-box");
      const sendBtn = document.getElementById("send-btn");
      const statusText = document.getElementById("status");

      const userText = promptInput.value.trim();
      if (!userText) return;

      if (!apiKey) {
        alert("Please enter a valid Gemini API Key.");
        return;
      }

      // Append User Message
      appendMessage(userText, "user");
      promptInput.value = "";
      sendBtn.disabled = true;
      statusText.innerText = "Processing interaction...";

      try {
        // Initialize standard JS SDK Client
        const ai = new GoogleGenAI({ apiKey });

        // Build payload targeting gemini-3.6-flash via Interactions API
        const payload = {
          model: "gemini-3.6-flash",
          input: userText
        };

        // Maintain server-side conversation state if previous turn exists
        if (previousInteractionId) {
          payload.previous_interaction_id = previousInteractionId;
        }

        const interaction = await ai.interactions.create(payload);

        // Store interaction ID for continuous turns
        if (interaction.id) {
          previousInteractionId = interaction.id;
        }

        // Retrieve output content
        const outputText = interaction.output_text || 
                           interaction.steps?.find(s => s.type === "model_output")?.content?.[0]?.text || 
                           "No output generated.";

        appendMessage(outputText, "model");
        statusText.innerText = `Last Interaction ID: ${previousInteractionId.slice(0, 12)}...`;
      } catch (err) {
        console.error("Interactions API Error:", err);
        appendMessage(`Error: ${err.message || 'Failed to complete interaction request.'}`, "model");
        statusText.innerText = "Request failed.";
      } finally {
        sendBtn.disabled = false;
      }
    }

    function appendMessage(text, sender) {
      const chatBox = document.getElementById("chat-box");
      const msg = document.createElement("div");
      msg.className = `message ${sender}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Expose to window for inline onclick handler
    window.sendInteraction = sendInteraction;
  </script>
</body>
</html>
